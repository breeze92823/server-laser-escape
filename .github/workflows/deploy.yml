name: Deploy to Bloxity

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ secrets.MULTIPLAYER_SERVER_URL }}

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..
        # change "dist" to your actual Vite build output dir if different

      - name: Upload to Bloxity
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOXITY_UPLOAD_TOKEN }}" \
            -F "file=@build.zip" \
            -w "\nHTTP status: %{http_code}\n" \
            "${{ secrets.BLOXITY_UPLOAD_URL }}"
