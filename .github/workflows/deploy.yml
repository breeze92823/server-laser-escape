name: Deploy to Bloxity

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # main -> prod's own multiplayer backend; every other branch (dev
          # included) keeps using the dev one. Two separate repo secrets so
          # prod players are never routed onto the dev Colyseus instance.
          VITE_SERVER_URL: ${{ github.ref_name == 'main' && secrets.MULTIPLAYER_SERVER_URL_PROD || secrets.MULTIPLAYER_SERVER_URL_DEV }}

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..
        # change "dist" to your actual Vite build output dir if different

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/laser-to-escape/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${{ secrets.BLOXITY_UPLOAD_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
